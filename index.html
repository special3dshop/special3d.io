<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special3D</title>

<link rel="icon" type="image/png" href="special%203d%20logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#ffffff;
    color:#111;
}

/* ========================= */
/* NAVBAR */
/* ========================= */

.navbar{
    height:80px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 50px;
    border-bottom:1px solid #e5e5e5;
    background:white;
    position:sticky;
    top:0;
    z-index:1000;
}

.left-nav,
.right-nav{
    display:flex;
    align-items:center;
    gap:30px;
}

.logo{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    font-size:34px;
    font-weight:700;
    letter-spacing:2px;
    cursor:pointer;
}

.nav-link{
    text-decoration:none;
    color:black;
    font-weight:500;
    cursor:pointer;
}

/* ========================= */
/* MEGA MENU */
/* ========================= */

.dropdown{
    position:relative;
}

.mega-menu{
    display:none;

    position:absolute;
    top:45px;
    left:0;

    width:900px;

    background:white;

    padding:20px;

    border-radius:15px;

    box-shadow:0 15px 40px rgba(0,0,0,0.15);

    grid-template-columns:repeat(3,1fr);

    gap:20px;
}

.dropdown:hover .mega-menu{
    display:grid;
}

.menu-card{
    text-decoration:none;
    color:black;
}

.menu-card img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    transition:0.3s;
}

.menu-card:hover img{
    transform:scale(1.04);
}

.menu-title{
    text-align:center;
    margin-top:10px;
    font-size:18px;
    font-weight:600;
}

/* ========================= */
/* ICONS */
/* ========================= */

.icon{
    font-size:22px;
    color:black;
    transition:0.2s;
}

.icon:hover{
    transform:scale(1.1);
}

/* ========================= */
/* HERO */
/* ========================= */

.hero{
    max-width:1500px;
    margin:auto;
    padding:50px 25px;
}

.hero-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.hero-card{
    position:relative;
    overflow:hidden;
    border-radius:20px;
    cursor:pointer;
}

.hero-card img{
    width:100%;
    height:650px;
    object-fit:cover;
    transition:0.4s;
}

.hero-card:hover img{
    transform:scale(1.05);
}

.hero-text{
    position:absolute;
    bottom:25px;
    left:25px;

    color:white;

    font-size:34px;
    font-weight:bold;

    text-shadow:0 3px 10px rgba(0,0,0,0.8);
}

/* ========================= */
/* MOBILE */
/* ========================= */

@media (max-width:1000px){

    .hero-grid{
        grid-template-columns:1fr;
    }

    .mega-menu{
        width:95vw;
        grid-template-columns:1fr;
    }

    .navbar{
        padding:0 20px;
    }

    .logo{
        font-size:24px;
    }
}

</style>
</head>
<body>

<!-- ====================== -->
<!-- NAVBAR -->
<!-- ====================== -->

<nav class="navbar">

    <div class="left-nav">

        <div class="dropdown">

            <span class="nav-link">
                Shop ▼
            </span>

            <div class="mega-menu">

                <!-- FACE -->

                <a href="FACE_LINK_HERE" class="menu-card">

                    <img src="images/face.jpg" alt="Face">

                    <div class="menu-title">
                        Face
                    </div>

                </a>

                <!-- BLANK -->

                <a href="BLANK_LINK_HERE" class="menu-card">

                    <img src="images/blank.jpg" alt="Blank">

                    <div class="menu-title">
                        Blank
                    </div>

                </a>

                <!-- CUSTOM -->

                <a href="CUSTOM_LINK_HERE" class="menu-card">

                    <img src="images/custom.jpg" alt="Custom">

                    <div class="menu-title">
                        Custom
                    </div>

                </a>

            </div>

        </div>

        <a href="MERCH_LINK_HERE" class="nav-link">
            Merch
        </a>

    </div>

    <div class="logo">
        Special3D
    </div>

    <div class="right-nav">

        <a href="LOGIN_LINK_HERE">
            <i class="fa-regular fa-user icon"></i>
        </a>

        <a href="CART_LINK_HERE">
            <i class="fa-solid fa-cart-shopping icon"></i>
        </a>

    </div>

</nav>

<!-- ====================== -->
<!-- HERO SECTION -->
<!-- ====================== -->

<section class="hero">

    <div class="hero-grid">

        <a href="FACE_LINK_HERE" class="hero-card">

            <img src="images/face.jpg" alt="Face">

            <div class="hero-text">
                Face
            </div>

        </a>

        <a href="BLANK_LINK_HERE" class="hero-card">

            <img src="images/blank.jpg" alt="Blank">

            <div class="hero-text">
                Blank
            </div>

        </a>

        <a href="CUSTOM_LINK_HERE" class="hero-card">

            <img src="images/custom.jpg" alt="Custom">

            <div class="hero-text">
                Custom
            </div>

        </a>

    </div>

</section>

</body>
</html>
