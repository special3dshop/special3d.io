<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face - Special3D</title>

<link rel="icon" type="image/png" href="../special 3d logo.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#fff;
    padding:50px;
}

.product-container{
    max-width:1400px;
    margin:auto;
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
}

/* LEFT SIDE */

.main-image img{
    width:100%;
    border-radius:20px;
}

.extra-images{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:10px;
}

.extra-images img{
    width:100%;
    height:220px;
    object-fit:cover;
    border-radius:12px;
    cursor:pointer;
    transition:0.2s;
}

.extra-images img:hover{
    transform:scale(1.02);
}

/* RIGHT SIDE */

.product-info h1{
    font-size:42px;
    margin-bottom:15px;
}

.rating{
    margin-bottom:25px;
    color:#f5b301;
    font-size:20px;
}

.rating span{
    color:#666;
    margin-left:10px;
    font-size:16px;
}

.style-title{
    font-size:22px;
    font-weight:bold;
    margin-bottom:15px;
}

.style-grid{
    display:flex;
    gap:15px;
    margin-bottom:30px;
}

.style-card{
    text-align:center;
    cursor:pointer;
}

.style-card img{
    width:110px;
    height:110px;
    object-fit:cover;
    border-radius:12px;
    border:2px solid transparent;
}

.style-card img:hover{
    border-color:black;
}

.style-card p{
    margin-top:8px;
}

.description{
    margin-bottom:30px;
    line-height:1.6;
    color:#444;
}

.price-box{
    border:1px solid #ddd;
    border-radius:15px;
    padding:20px;
    margin-bottom:20px;
}

.price-option{
    display:flex;
    justify-content:space-between;
    padding:12px 0;
}

.price-option:first-child{
    border-bottom:1px solid #eee;
}

.location{
    font-weight:bold;
}

.price{
    font-size:22px;
    font-weight:bold;
}

.cart-btn{
    width:100%;
    padding:18px;
    border:none;
    background:black;
    color:white;
    font-size:18px;
    border-radius:12px;
    cursor:pointer;
}

.cart-btn:hover{
    opacity:0.9;
}

/* MOBILE */

@media(max-width:900px){
    body{
        padding:20px;
    }

    .product-container{
        grid-template-columns:1fr;
    }
}

</style>
</head>

<body>

<div class="product-container">

    <!-- LEFT SIDE -->
    <div class="main-image">

        <img id="mainImg"
        src="../blue background marshmallows.png"
        alt="Face Product">

        <div class="extra-images">

            <img src="../face2.png"
            onclick="changeImage(this.src)"
            alt="View 2">

            <img src="../face3.png"
            onclick="changeImage(this.src)"
            alt="View 3">

        </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="product-info">

        <h1>Face Marshmallow</h1>

        <div class="rating">
            ★★★★★
            <span>4.9 (127 reviews)</span>
        </div>

        <div class="style-title">
            Choose Your Style
        </div>

        <div class="style-grid">

            <div class="style-card">
                <img src="../blue background marshmallows.png">
                <p>Face</p>
            </div>

            <div class="style-card">
                <img src="../green background marhsmallow no face.png">
                <p>Blank</p>
            </div>

            <div class="style-card">
                <img src="../yellow background custom marshmallows.png">
                <p>Custom</p>
            </div>

        </div>

        <div class="description">
            Custom marshmallow-style 3D printed products designed for gifts,
            branding, and creative displays. High detail, smooth finish, and
            fully customizable designs.
        </div>

        <div class="price-box">

            <div class="price-option">
                <div class="location">Troy, MI area</div>
                <div class="price">$19.99</div>
            </div>

            <div class="price-option">
                <div class="location">Outside Troy, MI</div>
                <div class="price">$32.00</div>
            </div>

        </div>

        <button class="cart-btn">
            Add To Cart
        </button>

    </div>

</div>

<script>

function changeImage(src){
    document.getElementById("mainImg").src = src;
}

</script>

</body>
</html>
